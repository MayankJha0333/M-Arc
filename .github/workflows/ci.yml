# CI/CD for Kite.
#
# CI — every push to main, and every pull request into main:
#      `npm run test:report` on macOS, Linux and Windows. Each system's report is kept
#      with the run (Actions → the run → Artifacts) and its summary shows on the run page.
# CD — when all three pass on main: build Kite.dmg / Kite.zip (Apple Silicon + Intel)
#      and keep them with the run. Pushing a version tag (v1.2.3) also publishes them
#      as a GitHub Release.
name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch cancels the run still going for the older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test · ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, name: macOS }
          - { os: ubuntu-latest, name: Linux }
          - { os: windows-latest, name: Windows }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Browser and system libraries for the tests
        run: npx playwright install --with-deps chromium
      - name: Virtual screen (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y xvfb
      - name: Run every check and write the report
        run: npm run test:report
      - name: Show the summary on this run's page
        if: always()
        shell: bash
        run: '[ -f test-report/summary.md ] && cat test-report/summary.md >> "$GITHUB_STEP_SUMMARY" || true'
      - name: Keep the full report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.name }}
          path: test-report
          retention-days: 14

  build:
    name: Build Kite for macOS
    needs: test # only when every system passed
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build Kite.dmg and Kite.zip (Apple Silicon + Intel, not signed)
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # no Apple Developer ID: build unsigned
      - name: Keep the app with this run
        uses: actions/upload-artifact@v4
        with:
          name: Kite-macOS-${{ github.sha }}
          path: |
            release/*.dmg
            release/*.zip
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Kite-macOS-${{ github.sha }}
          path: release
      - name: Create the release with the app attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" release/* --repo "${{ github.repository }}" --title "Kite ${{ github.ref_name }}" --generate-notes
