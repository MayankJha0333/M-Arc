# Runs `npm run test:report` on macOS, Linux and Windows on every push.
# Each system's report is attached to the run (Actions → this run → Artifacts),
# and a short summary appears on the run's page.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, name: macOS }
          - { os: ubuntu-latest, name: Linux }
          - { os: windows-latest, name: Windows }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Browser and system libraries for the tests
        run: npx playwright install --with-deps chromium
      - name: Install a virtual screen (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y xvfb
      - name: Run every check and write the report
        run: npm run test:report
      - name: Show the summary on this run's page
        if: always()
        shell: bash
        run: '[ -f test-report/summary.md ] && cat test-report/summary.md >> "$GITHUB_STEP_SUMMARY" || true'
      - name: Keep the full report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.name }}
          path: test-report
          retention-days: 14
